// User answers state tracker
let userAnswers = {};
let score = 0;

function renderQuestions() {
    const container = document.getElementById('questions-list');
    container.innerHTML = '';

    questionsData.forEach((q) => {
        const badgeColors = {
            emerald: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
            amber: 'bg-amber-500/10 text-amber-400 border-amber-500/30',
            rose: 'bg-rose-500/10 text-rose-400 border-rose-500/30'
        };

        const cardHtml = `
            <div id="q-card-${q.id}" class="glass-card rounded-2xl p-5 relative overflow-hidden">
                <!-- Header badge & topic -->
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${badgeColors[q.diffColor]}">
                            ${q.difficulty}
                        </span>
                        <span class="text-xs text-slate-400 font-medium">Topic: ${q.topic}</span>
                    </div>
                    <span class="text-xs font-semibold text-slate-500">Soal #${q.id}</span>
                </div>

                <!-- Question Text -->
                <h3 class="text-sm lg:text-base font-semibold text-slate-100 mb-4 leading-relaxed">
                    ${q.question}
                </h3>

                <!-- Options grid -->
                <div class="space-y-2 mb-4">
                    ${q.options.map(opt => `
                        <button onclick="selectOption(${q.id}, '${opt.key}')" 
                                id="opt-btn-${q.id}-${opt.key}"
                                class="w-full text-left p-3 rounded-xl border border-slate-700/60 bg-slate-800/40 hover:bg-slate-800/80 hover:border-slate-600 transition duration-200 flex items-center space-x-3 text-xs lg:text-sm">
                            <span class="w-6 h-6 rounded-lg bg-slate-700/60 border border-slate-600/80 flex items-center justify-center font-bold text-slate-300 text-xs shrink-0 option-key">
                                ${opt.key}
                            </span>
                            <span class="text-slate-200">${opt.text}</span>
                        </button>
                    `).join('')}
                </div>

                <!-- Action Controls -->
                <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800">
                    <div class="flex items-center space-x-2">
                        <button onclick="checkUserAnswer(${q.id})" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-semibold text-slate-200 transition">
                            <i class="fa-solid fa-check mr-1.5 text-emerald-400"></i> Cek Jawaban
                        </button>
                    </div>

                    <!-- AI Auto Answer & Explain Button -->
                    <button onclick="generateAIAnswer(${q.id})" id="ai-btn-${q.id}"
                            class="ai-pulse px-4 py-1.5 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 text-white font-bold text-xs shadow-lg flex items-center space-x-2 transition transform hover:scale-[1.02]">
                        <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
                        <span>Jawab & Bahas Otomatis (AI)</span>
                    </button>
                </div>

                <!-- Answer Status Banner -->
                <div id="status-banner-${q.id}" class="hidden mt-3 p-3 rounded-xl text-xs font-medium flex items-center space-x-2"></div>

                <!-- AI Detailed Explanation Output Box -->
                <div id="ai-box-${q.id}" class="hidden mt-4 p-4 rounded-xl bg-slate-950/90 border border-purple-900/60 text-xs text-slate-300 space-y-2">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2 text-purple-300 font-bold">
                        <span class="flex items-center">

        container.insertAdjacentHTML('beforeend', cardHtml);

}

function selectOption(qId, key) {
    userAnswers[qId] = key;
    const q = questionsData.find(item => item.id === qId);

    // Reset styles for options in this question
    q.options.forEach(opt => {
        const btn = document.getElementById(`opt-btn-${qId}-${opt.key}`);
        btn.className = 'w-full text-left p-3 rounded-xl border border-slate-700/60 bg-slate-800/40 hover:bg-slate-800/80 hover:border-slate-600 transition duration-200 flex items-center space-x-3 text-xs lg:text-sm';
    });

    // Highlight chosen option
    const chosenBtn = document.getElementById(`opt-btn-${qId}-${key}`);
    chosenBtn.className = 'w-full text-left p-3 rounded-xl border-2 border-indigo-500 bg-indigo-950/40 flex items-center space-x-3 text-xs lg:text-sm font-medium';
}

function checkUserAnswer(qId) {
    const selected = userAnswers[qId];
    const q = questionsData.find(item => item.id === qId);
    const banner = document.getElementById(`status-banner-${qId}`);

    if (!selected) {
        banner.className = 'mt-3 p-3 rounded-xl text-xs font-medium bg-amber-950/60 border border-amber-800/60 text-amber-300 flex items-center space-x-2';
        banner.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>Pilih salah satu jawaban terlebih dahulu!</span>`;
        banner.classList.remove('hidden');
        return;
    }

    const isCorrect = selected === q.correctKey;
    
    // Update score
    if (isCorrect) {
        banner.className = 'mt-3 p-3 rounded-xl text-xs font-medium bg-emerald-950/70 border border-emerald-800/80 text-emerald-300 flex items-center space-x-2';
        banner.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i><span><b>Benar!</b> Jawaban Anda (${selected}) tepat sekali.</span>`;
        
        // Highlight option as green
        const btn = document.getElementById(`opt-btn-${qId}-${selected}`);
        btn.className = 'w-full text-left p-3 rounded-xl border-2 border-emerald-500 bg-emerald-950/50 flex items-center space-x-3 text-xs lg:text-sm font-semibold text-emerald-200';
    } else {
        banner.className = 'mt-3 p-3 rounded-xl text-xs font-medium bg-rose-950/70 border border-rose-800/80 text-rose-300 flex items-center space-x-2';
        banner.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400 text-sm"></i><span><b>Belum Tepat.</b> Jawaban Anda: ${selected}. Kunci yang benar: <b>${q.correctKey}</b>.</span>`;

        // Highlight option as red
        const btn = document.getElementById(`opt-btn-${qId}-${selected}`);
        btn.className = 'w-full text-left p-3 rounded-xl border-2 border-rose-500 bg-rose-950/50 flex items-center space-x-3 text-xs lg:text-sm font-medium text-rose-200';
    }
    banner.classList.remove('hidden');
    calculateTotalScore();
}

function calculateTotalScore() {
    let correctCount = 0;
    questionsData.forEach(q => {
        if (userAnswers[q.id] === q.correctKey) {
            correctCount++;
        }
    });
    document.getElementById('score-display').innerText = `${correctCount} / ${questionsData.length}`;
}

function resetAllQuiz() {
    userAnswers = {};
    calculateTotalScore();
    renderQuestions();
}

// Helper to sanitize LaTeX chemical formulas into clean HTML sub/sup
function cleanChemFormula(text) {
    if (!text) return '';
    return text
        // Clean up LaTeX syntax like $H_3O^+$ or H_2SO_4 into HTML sub/sup
        .replace(/\$([^$]+)\$/g, '$1') // remove dollar wrappers
        .replace(/\\rightarrow/g, '→')
        .replace(/\\rightleftharpoons/g, '⇌')
        .replace(/\_\{([^}]+)\}/g, '<sub>$1</sub>')
        .replace(/\_([0-9a-zA-Z])/g, '<sub>$1</sub>')
        .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
        .replace(/\^([\+\-0-9a-zA-Z]+)/g, '<sup>$1</sup>');
}

async function generateAIAnswer(qId) {
    const q = questionsData.find(item => item.id === qId);
    const aiBox = document.getElementById(`ai-box-${qId}`);
    const aiContent = document.getElementById(`ai-content-${qId}`);

    aiBox.classList.remove('hidden');
    aiContent.innerHTML = `
        <div class="flex items-center space-x-3 py-2 text-purple-400">
            <i class="fa-solid fa-spinner fa-spin text-lg"></i>
            <span>Agent AI sedang menganalisis dan meringkas pembahasan...</span>
        </div>
    `;

    selectOption(qId, q.correctKey);

    const promptText = `
Anda adalah Guru Kimia SMA. Berikan PEMBAHASAN SINGKAT, RINGKAS, DAN RINGKAS untuk soal berikut (maksimal 3-4 kalimat ringkas):

Topik: ${q.topic}
Soal: "${q.question}"
Pilihan Jawaban:
${q.options.map(o => `${o.key}. ${o.text}`).join('\n')}

Petunjuk Format:
1. **Kunci Jawaban**: [Sebutkan Opsi dan teksnya]
2. **Ringkasan Alasan**: Jelaskan secara langsung dan singkat (2-3 kalimat saja) mengapa jawaban ini benar.
3. Jangan gunakan sintaks LaTeX rumit dengan simbol dollar ($) atau kurung kurawal ({}), tuliskan rumus kimia secara bersih dan mudah dibaca.
`;

    const systemPrompt = "Berikan pembahasan kimia yang sangat ringkas, padat, akurat, dan bersih tanpa simbol format LaTeX yang membingungkan.";

    try {
        const apiKey = ""; 
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error(`HTTP Error status: ${response.status}`);
        }

        const data = await response.json();
        const responseText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

        if (responseText) {
            const formattedText = cleanChemFormula(responseText);
            aiContent.innerHTML = marked.parse(formattedText);
            
            // Render KaTeX if any remaining math syntax exists
            if (window.renderMathInElement) {
                renderMathInElement(aiContent, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
            checkUserAnswer(qId);
        } else {
            aiContent.innerHTML = `<span class="text-rose-400"><i class="fa-solid fa-circle-exclamation mr-1"></i> Gagal memuat pembahasan AI.</span>`;
        }
    } catch (err) {
        console.error("AI Generation Error:", err);
        const fallbackText = cleanChemFormula(`
**Kunci Jawaban**: **${q.correctKey}** - ${q.options.find(o => o.key === q.correctKey).text}

**Ringkasan Pembahasan**:
Soal ini menguji konsep **${q.topic}**. Pilihan **${q.correctKey}** adalah jawaban yang paling tepat berdasarkan prinsip kesetimbangan kimia dan definisi asam-basa yang berlaku.
        `);
        aiContent.innerHTML = marked.parse(fallbackText);
        checkUserAnswer(qId);
    }
}

            <i class="fa-solid fa-spinner fa-spin"></i>
            <span>Menghubungi Agent AI...</span>
        </div>
    `;

    try {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const payload = {
            contents: [{ parts: [{ text: query }] }],
            systemInstruction: {
                parts: [{ text: `Anda adalah Guru Kimia AI yang KHUSUS memfokuskan pembahasan pada materi Kimia (terutama Asam Basa: Arrhenius, Brønsted-Lowry, dan Lewis).

ATURAN KETAT BANTUAN SISWA:
1. Periksa apakah pertanyaan pengguna berhubungan dengan topik Kimia atau Asam Basa.
2. JIKA PERTANYAAN TIDAK RELEVAN DENGAN KIMIA (misalnya koding, percakapan umum, berita, olahraga, sejarah umum, matematika non-kimia, dll.):
   - Anda HARUS MENOLAK memberikan jawaban atas pertanyaan tersebut.
   - Sampaikan penolakan dengan sopan, contoh: "Maaf, saya adalah Guru Kimia AI yang khusus diprogram untuk menjawab pertanyaan seputar materi Kimia dan Asam Basa. Silakan ajukan pertanyaan yang berkaitan dengan topik tersebut!"
3. JIKA PERTANYAAN RELEVAN DENGAN KIMIA:
   - Jawab dengan jelas, singkat, padat, dan mudah dipahami.
   - Jangan gunakan simbol LaTeX mentah ($ atau {}) yang membingungkan.` }]
            }
        };

        const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;

        if (text) {
            const cleanText = cleanChemFormula(text);
            responseBox.innerHTML = marked.parse(cleanText);
            if (window.renderMathInElement) {
                renderMathInElement(responseBox, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        } else {
            responseBox.innerText = "Maaf, tidak mendapat respon dari AI.";
        }
    } catch (e) {
        responseBox.innerText = "Terjadi kesalahan saat memproses pertanyaan Anda.";
    }
}

// On Window Load initialization
window.onload = function() {
    renderQuestions();
};
</script>
